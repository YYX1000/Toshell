name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  # 前端构建 → 同步 webdist（供 server 嵌入）
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: web
      - name: Build web
        run: npm run build
        working-directory: web
      - name: Sync webdist
        run: |
          rm -rf cmd/server/webdist
          mkdir -p cmd/server/webdist
          cp -r web/dist/. cmd/server/webdist/
      - uses: actions/upload-artifact@v4
        with:
          name: webdist
          path: cmd/server/webdist

  # ── 发版门禁：端到端冒烟（打包发布前必须通过）──────────────────────────
  # 覆盖历史事故：改动后忘重编服务端、模板档位构建失败、接口路由/鉴权失效。
  # 托管 runner 上不跑真实植入端（未签名载荷会被托管杀软拦），故固定 -SkipImplant。
  e2e-smoke:
    runs-on: windows-latest
    needs: web
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webdist
          path: cmd/server/webdist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true
      - name: Prefetch implant toolchain (Go 1.20.14)
        shell: powershell
        run: |
          $env:GOTOOLCHAIN = 'go1.20.14'
          go version
      - name: E2E smoke (server build + 3 payload flavors + auth + routes)
        # 用 Windows PowerShell 5.1 跑：脚本是按 5.1 语义编写与静态校验的
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\e2e_smoke.ps1 -SkipImplant -KeepArtifacts
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-artifacts
          path: ${{ runner.temp }}\toshell-e2e-*
          if-no-files-found: ignore
          retention-days: 7

  # 多平台交叉编译 + 打包 + 上传 GitHub Release
  build:
    runs-on: ubuntu-latest
    needs: [ web, e2e-smoke ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe, zip: toshell-server-windows-amd64.zip, deploy: release/deploy.bat }
          - { goos: windows, goarch: '386', ext: .exe, zip: toshell-server-windows-386.zip, deploy: release/deploy.bat }
          - { goos: linux,   goarch: amd64, ext: '', zip: toshell-server-linux-amd64.zip, deploy: release/deploy.sh }
          - { goos: linux,   goarch: arm64, ext: '', zip: toshell-server-linux-arm64.zip, deploy: release/deploy.sh }
          - { goos: darwin,  goarch: amd64, ext: '', zip: toshell-server-darwin-amd64.zip, deploy: release/deploy.sh }
          - { goos: darwin,  goarch: arm64, ext: '', zip: toshell-server-darwin-arm64.zip, deploy: release/deploy.sh }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webdist
          path: cmd/server/webdist

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      # 构建 + 组装 + 自校验全部走 cmd/devtool —— 与本地 `go run ./cmd/devtool package`
      # 是同一实现，CI 与本地不可能产出不同的包。
      # 平台矩阵仍留在上面：CI 需要它做并行与按平台上传；它与 devtool 目标清单的一致性
      # 由 `devtool check` 门禁（cmd/devtool/check.go 的 checkReleaseMatrix）。
      #
      # devtool 内部等价于原先被替换掉的三步：
      #   1) Build server —— GOOS/GOARCH/CGO_ENABLED=0 + -tags webui + ldflags 注入 version/commit/buildTime
      #   2) Package zip  —— 组装全部条目（implant/ implant_c/ configs/ docs/ README 用 release/README.md 等）
      #   3) 自校验      —— 包布局（含 implant/main.go 与 implant_c/main.c）；并在目标平台等于当前
      #                       运行平台时执行产物、断言自报版本与 tag 一致（原先只查 linux/amd64）
      - name: Build + package (cmd/devtool)
        run: |
          go run ./cmd/devtool package             --target "${{ matrix.goos }}/${{ matrix.goarch }}"             --version "${GITHUB_REF_NAME#v}"             --out .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
          if-no-files-found: error

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip }}
          # 版本号跟随 tag（v1.3.x）；标题也用 tag 名
          name: ${{ github.ref_name }}
          # 固定正文：不要用 generate_release_notes —— 它会在每次重跑（多平台矩阵 / 重打 tag）
          # 时重复追加一行 "Full Changelog: ..."，导致正文被刷屏。
          body: |
            Toshell ${{ github.ref_name }}

            使用前请修改配置文件，安装go和相关go类库。

            更新日志：[更新日志](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

            项目介绍：[项目介绍](https://github.com/${{ github.repository }}/blob/main/README.md)

            使用说明：[使用说明](https://github.com/${{ github.repository }}/blob/main/USAGE.md)

            Bug或者建议请提交issue。

  # 全部 zip 汇总后生成校验清单（sha256），随 Release 一起发布。
  # 单独一个 job 是因为矩阵里每个 job 只知道自己那一个 zip。
  checksums:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 必须先 checkout：下面 files 里要补发的 LICENSE/DISCLAIMER/THIRD-PARTY-NOTICES
      # 都在仓库里，不 checkout 就会被 softprops 静默跳过（v1.3.4/1.3.5 实测如此）。
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd dist
          # 只对发布 zip 求哈希，顺序固定便于比对
          ls -1 *.zip | sort | xargs sha256sum > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          # 只补发 checksums.txt + 许可与声明（不传 name/body，避免覆盖已写好的 Release 标题与正文）。
          # 这三个文件由单个 job 上传（矩阵里每个 job 都传会并发冲突）。
          files: |
            dist/checksums.txt
            LICENSE
            DISCLAIMER.md
            THIRD-PARTY-NOTICES.md
