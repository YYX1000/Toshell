name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  # 前端构建 → 同步 webdist（供 server 嵌入）
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: web
      - name: Build web
        run: npm run build
        working-directory: web
      - name: Sync webdist
        run: |
          rm -rf cmd/server/webdist
          mkdir -p cmd/server/webdist
          cp -r web/dist/. cmd/server/webdist/
      - uses: actions/upload-artifact@v4
        with:
          name: webdist
          path: cmd/server/webdist

  # ── 发版门禁：端到端冒烟（打包发布前必须通过）──────────────────────────
  # 覆盖历史事故：改动后忘重编服务端、模板档位构建失败、接口路由/鉴权失效。
  # 托管 runner 上不跑真实植入端（未签名载荷会被托管杀软拦），故固定 -SkipImplant。
  e2e-smoke:
    runs-on: windows-latest
    needs: web
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webdist
          path: cmd/server/webdist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true
      - name: Prefetch implant toolchain (Go 1.20.14)
        shell: powershell
        run: |
          $env:GOTOOLCHAIN = 'go1.20.14'
          go version
      - name: E2E smoke (server build + 3 payload flavors + auth + routes)
        # 用 Windows PowerShell 5.1 跑：脚本是按 5.1 语义编写与静态校验的
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\e2e_smoke.ps1 -SkipImplant -KeepArtifacts
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-artifacts
          path: ${{ runner.temp }}\toshell-e2e-*
          if-no-files-found: ignore
          retention-days: 7

  # 多平台交叉编译 + 打包 + 上传 GitHub Release
  # 单 job 构建全部 6 个平台，不再用 matrix：
  #   · 平台清单只在 cmd/devtool/package.go 定义一处，CI 与本地是同一实现
  #   · 发布原子性 —— 矩阵配 fail-fast:false 时，某个平台失败仍会把其余 zip 与基于
  #     它们算出的 checksums 传上 Release，留下没有失败信号的残缺发布
  #   · 全部文件由单 job 上传，不再有"矩阵并发向同一 Release 追加"的冲突
  #     （原先 LICENSE/DISCLAIMER/THIRD-PARTY-NOTICES 正是因该冲突被挪到独立的 checksums job）
  #
  # devtool 内部依次完成：GOOS/GOARCH + CGO_ENABLED=0 + -tags webui 编译；组装
  # implant/ implant_c/ configs/ docs/ 等全部条目；写 zip 条目执行位；校验包布局；
  # 对当前运行平台执行产物并断言自报版本与 tag 一致。
  # 输出：6 个 zip + checksums.txt（sha256，按文件名排序）
  build:
    runs-on: ubuntu-latest
    needs: [ web, e2e-smoke ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: webdist
          path: cmd/server/webdist

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Build + package (cmd/devtool)
        run: |
          go run ./cmd/devtool package --all             --version "${GITHUB_REF_NAME#v}"             --out .

      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: |
            toshell-server-*.zip
            checksums.txt
          if-no-files-found: error

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            toshell-server-*.zip
            checksums.txt
            LICENSE
            DISCLAIMER.md
            THIRD-PARTY-NOTICES.md
          # 版本号跟随 tag（v1.3.x）；标题也用 tag 名
          name: ${{ github.ref_name }}
          # 含 '-' 的 tag 视为预发布（semver 预发布，如 v1.3.5-yyx1000.1）。
          # 不标 prerelease 的话它会成为仓库的 Latest —— 那会把一次验证性构建
          # 摆到"最新版"的位置。稳定版 tag（v1.4.0）不含 '-'，行为不变。
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 固定正文：不要用 generate_release_notes —— 它会在每次重跑时重复追加一行
          # "Full Changelog: ..."，导致正文被刷屏。
          body: |
            Toshell ${{ github.ref_name }}

            使用前请修改配置文件，安装go和相关go类库。

            更新日志：[更新日志](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

            项目介绍：[项目介绍](https://github.com/${{ github.repository }}/blob/main/README.md)

            使用说明：[使用说明](https://github.com/${{ github.repository }}/blob/main/USAGE.md)

            Bug或者建议请提交issue。
