name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  # ── 前端构建 → 同步 webdist（供 server 嵌入） ──
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: web

      - name: Build web
        run: npm run build
        working-directory: web

      - name: Sync webdist (embed target)
        run: |
          rm -rf cmd/server/webdist
          mkdir -p cmd/server/webdist
          cp -r web/dist/. cmd/server/webdist/

      - uses: actions/upload-artifact@v4
        with:
          name: webdist
          path: cmd/server/webdist

  # ── Go 服务端构建（-tags webui，嵌入前端）+ vet ──
  server:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - uses: actions/download-artifact@v4
        with:
          name: webdist
          path: cmd/server/webdist

      - name: Build server (tags webui)
        run: |
          LDFLAGS="-s -w -X main.version=1.3.5 -X main.commit=$(git rev-parse --short HEAD) -X main.buildTime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          go build -tags webui -ldflags "$LDFLAGS" -o toserver ./cmd/server

      - name: Vet
        # 全量 vet：清理掉 24 个不可达包后，`./...` 才第一次真正可跑
        # （此前只能 vet ./internal/server/...，其余包一旦失效无人察觉）
        run: go vet ./...

      - name: Invariants (devtool check)
        # 校验 cmd/devtool/check.go 中定义的 5 条不变量：
        #   · 模板唯一源完好（含 main.go；implant_c 与其同级且有 main.c）
        #   · release/implant{,_c} 为生成物：不被 git 跟踪，且与唯一源逐字节一致
        #   · 两份 server.yaml.example 内容一致（打包用前者，本地起服务用后者）
        #   · 打包与发版门禁指向同一模板源，且不引用生成物
        #   · web/vite.config.js 不存在（它会遮蔽 vite.config.ts）
        run: go run ./cmd/devtool check

      - name: Run unit tests
        # 全量测试（原先只跑 4 个包，而仓库有 11 个包带测试 —— 7 个包没有任何门禁）。
        # 这个缺口曾经真实存在：internal/server/api 的 3 个用例长期失败却无人发现
        #   · loader 链测试助手把 mshta 骨架里的 `-enc <注入器Base64>` 占位符当载荷解码
        #   · shellcode 未签名的落地建议漏了「内存加载」这个术语（已补齐）
        # 两处已修，故这里改为 ./...；新增测试包不再需要单独登记。
        run: go test ./...
