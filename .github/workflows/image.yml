name: Container Image

# 推送到 GitHub Container Registry（ghcr.io）的镜像。
#
# PR 上**只构建并冒烟测试，不推送** —— 镜像发布只发生在 tag 或手动触发时，
# 且必须先通过冒烟测试（push job 的 needs）。
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    # 只在改动镜像相关文件时跑：完整构建（含 Go 工具链）耗时较长，
    # 没必要因为一次 Go 业务代码改动就重建镜像。
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/image.yml

permissions:
  contents: read
  packages: write

jobs:
  # 构建 linux/amd64 并实际起容器探健康检查。镜像"能构建"不等于"能跑"，
  # 而模板解析、配置自举、Go 工具链路径这些都只在运行时才暴露问题。
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (linux/amd64, load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: toshell-server:smoke
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — 起容器并探测 /api/v1/health
        run: |
          docker run -d --name smoke -p 18081:18081 toshell-server:smoke

          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/api/v1/health || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 2
          done

          echo "--- 容器日志 ---"
          docker logs smoke 2>&1 || true
          echo "--- 镜像体积 ---"
          docker image ls toshell-server:smoke --format '{{.Size}}' || true
          docker rm -f smoke >/dev/null 2>&1 || true

          if [ "$ok" != "1" ]; then
            echo "::error::容器未在 60s 内通过 /api/v1/health 健康检查"
            exit 1
          fi
          echo "健康检查通过"

      - name: 校验镜像内含植入端模板（服务端生成载荷依赖）
        run: |
          docker run --rm --entrypoint sh toshell-server:smoke -c '
            set -e
            test -f /app/toserver
            test -f /app/implant/main.go
            test -f /app/implant_c/main.c
            test -f /app/configs/server.yaml.example
            test -f /app/data/av_fingerprints.json
            command -v go >/dev/null
            echo "模板、配置样例、指纹库、go 工具链均就位"
          '

  # 多平台构建并推送到 ghcr.io。仅在 tag 或手动触发时执行，且 smoke 必须已通过。
  push:
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/toshell-server
          # 含 '-' 的预发布 tag 不移动 latest 标签，避免预发布镜像覆盖稳定版；
          # 手动触发（无 tag）时正常打 latest。
          #
          # ⚠️ 注释必须写在映射层：块标量（tags: |）内部的 '#' 不是 YAML 注释而是字面内容，
          # 会被原样喂给 metadata-action 并破坏其解析 —— 曾因此让 enable 失效，
          # 预发布 tag 照样推了 latest。
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
