name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  # ── 前端构建 → 同步 webdist（供 server 嵌入） ──
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: web

      - name: Build web
        run: npm run build
        working-directory: web

      - name: Sync webdist (embed target)
        run: |
          rm -rf cmd/server/webdist
          mkdir -p cmd/server/webdist
          cp -r web/dist/. cmd/server/webdist/

      - uses: actions/upload-artifact@v4
        with:
          name: webdist
          path: cmd/server/webdist

  # ── Go 服务端构建（-tags webui，嵌入前端）+ vet ──
  server:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - uses: actions/download-artifact@v4
        with:
          name: webdist
          path: cmd/server/webdist

      - name: Build server (tags webui)
        run: |
          LDFLAGS="-s -w -X main.version=1.3.5 -X main.commit=$(git rev-parse --short HEAD) -X main.buildTime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          go build -tags webui -ldflags "$LDFLAGS" -o toserver ./cmd/server

      - name: Vet
        run: go vet ./internal/server/...

      - name: Run unit tests (non-embedded)
        # 除既有基础包外，跑本版新增的纯逻辑测试：
        #   builder：构建标签矩阵 / 启动延迟模板渲染 / 默认模板不得含进程枚举 / PE 预检
        #   drivers：manifest sha256 比对、自检结论合并、JSON 字段、列表携带自检
        # 这些测试用桩函数替代 WinVerifyTrust，不依赖本机证书链与联网，Linux runner 可跑。
        run: |
          go test ./internal/common/... ./internal/server/config/... \
                  ./internal/server/builder/... ./internal/server/drivers/...
